<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Impresora portátil W100 · Casa Palermo</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  :root { --fg:#f4f6fb; --muted:#9aa4b8; --accent:#2f6bff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:radial-gradient(circle at 50% 35%, #26304a 0%, #0d111b 70%); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  header { text-align:center; padding:18px 16px 4px; }
  .brand { letter-spacing:.32em; font-size:.78rem; color:var(--muted); font-weight:600; }
  h1 { font-size:1.35rem; font-weight:650; margin-top:6px; }
  model-viewer { flex:1; width:100%; min-height:60vh; --poster-color:transparent; }
  .hint { text-align:center; color:var(--muted); font-size:.85rem; padding:6px 16px 18px; }
  .ar-btn { position:absolute; left:50%; bottom:22px; transform:translateX(-50%); background:var(--accent); color:#fff;
    border:0; border-radius:999px; padding:12px 22px; font-size:1rem; font-weight:600; box-shadow:0 6px 20px rgba(47,107,255,.45); }
</style>
</head>
<body>
<header>
  <div class="brand">CASA PALERMO</div>
  <h1>Impresora portátil W100</h1>
</header>
<model-viewer src="impresora.glb" alt="Impresora portátil W100 en 3D"
  camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="2500" rotation-per-second="18deg"
  camera-orbit="25deg 72deg auto" shadow-intensity="1" shadow-softness="0.8" exposure="1.05"
  environment-image="neutral" interaction-prompt="auto"
  ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed">
  <button slot="ar-button" class="ar-btn">Ver sobre tu mesa</button>
</model-viewer>
<p class="hint">Desliza para girar · pellizca para acercar</p>
</body>
</html>
